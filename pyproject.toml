[project]
name = "django-mosaic"
version = "0.2.0"
description = "A simple django blogging engine for the indieweb"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "j23n", email = "oss@j23n.com" },
]
license = {file = "LICENSE"}
keywords = [
    "django",
    "blog",
    "indieweb"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "django>=5.2.11,<7",
    "django-magic-authorization>=0.1.6",
    "django-markdownify>=0.9.6",
    "django-reversion>=5.1.0",
    "markdown>=3.6",
    "martor>=1.8.2",
    "pillow>=12.1.0",
    "pygments>=2.19.2",
    "python-dateutil>=2.9.0",
    "pyyaml>=6.0",
    "requests>=2.34.2",
]

[project.optional-dependencies]
# Deployment tooling (`manage.py mosaic deployment ...`) is optional; it pulls
# in fabric/paramiko/cryptography which most consumers don't need at runtime.
deploy = [
    "fabric>=3.2.2",
]
oauth = [
    "cryptography>=42",
    "pyjwt>=2.8",
]
jetstream = [
    "websockets>=12",
]

[project.scripts]
# Bootstrap a runnable project: `mosaic-admin init myblog`.
mosaic-admin = "django_mosaic.scaffold:main"

[project.urls]
Homepage = "https://app.radicle.xyz/nodes/iris.radicle.xyz/rad:zVdCS3rdBtnLLui7jaHTf4X9j6FD"
Repository = "https://app.radicle.xyz/nodes/iris.radicle.xyz/rad:zVdCS3rdBtnLLui7jaHTf4X9j6FD"
"Bug Tracker" = "https://app.radicle.xyz/nodes/iris.radicle.xyz/rad:zVdCS3rdBtnLLui7jaHTf4X9j6FD/issues"
Changelog = "https://app.radicle.xyz/nodes/iris.radicle.xyz/rad:zVdCS3rdBtnLLui7jaHTf4X9j6FD/tree/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.9.25,<0.10.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[dependency-groups]
dev = [
    "black>=26.1.0",
    "pygments>=2.19.2",
    "pytest>=9.0.2",
    "pytest-django>=4.11.1",
    "ruff>=0.14.13",
    "ty>=0.0.12",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["src", "."]

[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = "migrations"

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ"]
ignore = [
    "E501",    # line length is handled by black
    "B008",    # function calls in argument defaults (common in Django)
    "DJ012",   # model member ordering — cosmetic, not worth churning working code
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"__init__.py" = ["F401"]
