name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Black (format check)
        run: uv run black --check .
      - name: ty (type check)
        run: uv run ty check src || true  # advisory until annotations land

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        django-version: ["5.2", "6.0"]
    name: py${{ matrix.python-version }} / django${{ matrix.django-version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      # --python pins the interpreter (a checked-in .python-version would
      # otherwise override `uv python install` for every leg). --no-sync on the
      # test step is essential: a bare `uv run` re-syncs against uv.lock and
      # silently undoes the Django pin below, collapsing the matrix to one cell.
      - name: Install dependencies
        run: uv sync --all-extras --dev --python ${{ matrix.python-version }}
      - name: Pin Django ${{ matrix.django-version }}
        run: uv pip install --python ${{ matrix.python-version }} "django~=${{ matrix.django-version }}.0"
      - name: Show resolved versions
        run: uv run --no-sync --python ${{ matrix.python-version }} python -c "import sys, django; print('python', sys.version); print('django', django.get_version())"
      - name: Run tests
        run: uv run --no-sync --python ${{ matrix.python-version }} pytest -q
